name: PR Gate

on:
  pull_request:
    branches: ["main"]

# A newer push supersedes older runs on the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-gate:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: "read"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Check Markdown Formatting
        run: npm run format:check

      - name: Lint Markdown
        run: npm run lint:md

      - name: Go Test
        run: go test -v ./...

      - name: Check Retranslation Target Limit (<= 4)
        run: LLM_INIT=false go run . check_retranslate 4
