name: Update Blog Metadata

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "**/*_test.go"
  workflow_dispatch:

# Publish the current main tree. Keep the active publisher and coalesce pending
# refreshes: the next run includes every change already present on main.
concurrency:
  group: blog-metadata-main
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: "write"
      contents: "write"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - name: Cache npm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Update Metadata
        run: ./build.sh
        env:
          PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit Changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          message: "feat(blog): Update blog metadata"
          pull: '--rebase --autostash'
          push: 'origin HEAD:main'
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
